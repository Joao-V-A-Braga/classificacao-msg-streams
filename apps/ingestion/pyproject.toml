[project]
name = "ingestion"
version = "0.1.0"
description = "YouTube live chat scraper (Laya + Browser Harness, CPU) feeding the message-classification backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "browser-harness==0.1.13",
    "httpx[http2]>=0.28,<1",
    "laya>=0.1,<0.2",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "respx>=0.21,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
